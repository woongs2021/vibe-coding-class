<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>계정 만들기 — Lumo</title>
  <style>
    :root {
      --sb-green: #006241;
      --sb-green-accent: #00754a;
      --sb-green-accent-hover: #006038;
      --sb-house: #1e3932;
      --sb-green-light: #d4e9e2;
      --canvas-warm: #f2f0eb;
      --canvas-ceramic: #edebe9;
      --surface-white: #ffffff;
      --text-black: rgba(0, 0, 0, 0.87);
      --text-black-soft: rgba(0, 0, 0, 0.58);
      --input-border: #d6dbde;
      --card-shadow: 0 0 0.5px rgba(0, 0, 0, 0.14), 0 1px 1px rgba(0, 0, 0, 0.24);
      --radius-card: 12px;
      --radius-pill: 50px;
      --radius-input: 8px;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2rem;
      --space-6: 2.5rem;
      --space-8: 3.5rem;
      --gutter: 1rem;
      --gutter-md: 1.5rem;
      --gutter-lg: 2.5rem;
      --track: -0.01em;
      --track-tight: -0.16px;
      --font-sans: SoDoSans, "Helvetica Neue", Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: var(--track);
      color: var(--text-black);
      background: var(--canvas-warm);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    .wrap {
      width: min(100% - var(--gutter) * 2, 420px);
      margin-inline: auto;
      padding: var(--space-8) 0 var(--space-6);
    }

    @media (min-width: 768px) {
      .wrap {
        width: min(100% - var(--gutter-md) * 2, 420px);
      }
    }

    @media (min-width: 1024px) {
      .wrap {
        width: min(100% - var(--gutter-lg) * 2, 420px);
      }
    }

    .back {
      display: inline-block;
      margin-bottom: var(--space-5);
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: var(--track);
      color: var(--sb-green-accent);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back:hover {
      color: var(--sb-green);
      text-decoration: underline;
    }

    .back:focus-visible {
      outline: 2px solid var(--sb-green-accent);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .card {
      padding: var(--space-6) var(--space-5);
      background: var(--surface-white);
      border-radius: var(--radius-card);
      box-shadow: var(--card-shadow);
    }

    .card-badge {
      margin: 0 0 var(--space-3);
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sb-green-accent);
    }

    .card h1 {
      margin: 0 0 var(--space-3);
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: var(--track-tight);
      color: var(--sb-green);
    }

    .card-lead {
      margin: 0 0 var(--space-5);
      font-size: 1rem;
      color: var(--text-black-soft);
      line-height: 1.5;
    }

    .field {
      margin-bottom: var(--space-4);
    }

    .field:last-of-type {
      margin-bottom: var(--space-5);
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: var(--track);
      color: var(--text-black);
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: var(--track);
      color: var(--text-black);
      background: var(--surface-white);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-input);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input::placeholder {
      color: var(--text-black-soft);
    }

    input:hover {
      border-color: rgba(0, 117, 74, 0.35);
    }

    input:focus {
      outline: none;
      border-color: var(--sb-green-accent);
      box-shadow: 0 0 0 1px var(--sb-green-accent);
    }

    .btn {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      padding: 7px 16px;
      min-height: 44px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      line-height: 1.2;
      letter-spacing: var(--track);
      color: var(--surface-white);
      background: var(--sb-green-accent);
      border: 1px solid var(--sb-green-accent);
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn:hover {
      background: var(--sb-green-accent-hover);
      border-color: var(--sb-green-accent-hover);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn:focus-visible {
      outline: 2px solid var(--sb-green-accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="index.html">← 돌아가기</a>
    <div class="card">
      <p class="card-badge">Lumo</p>
      <h1>계정 만들기</h1>
      <p class="card-lead">이름과 이메일만으로 시작할 수 있습니다.</p>
      <form method="get" action="">
        <div class="field">
          <label for="name">이름</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="홍길동" required />
        </div>
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </div>
        <button class="btn" type="submit">계정 만들기</button>
      </form>
    </div>
  </main>
</body>
</html>
