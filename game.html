<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이모지 메모리 — Lumo</title>
  <style>
    /* Starbucks-inspired — DESIGN-starbucks.md (same tokens as index.html) */
    :root {
      --sb-green: #006241;
      --sb-green-accent: #00754a;
      --sb-green-accent-hover: #006038;
      --sb-house: #1e3932;
      --sb-green-light: #d4e9e2;
      --canvas-warm: #f2f0eb;
      --canvas-ceramic: #edebe9;
      --surface-white: #ffffff;
      --text-black: rgba(0, 0, 0, 0.87);
      --text-black-soft: rgba(0, 0, 0, 0.58);
      --text-white: #ffffff;
      --text-white-soft: rgba(255, 255, 255, 0.7);
      --card-shadow: 0 0 0.5px rgba(0, 0, 0, 0.14), 0 1px 1px rgba(0, 0, 0, 0.24);
      --radius-card: 12px;
      --radius-pill: 50px;
      --track: -0.01em;
      --track-tight: -0.16px;
      --font-sans: SoDoSans, "Helvetica Neue", Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: var(--track);
      color: var(--text-black);
      background: var(--canvas-warm);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0.75rem 2rem;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.25rem, 4vw, 1.5rem);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: var(--track-tight);
      color: var(--sb-green);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.75rem 1.25rem;
      margin-bottom: 1.25rem;
      max-width: 22rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--canvas-ceramic);
    }

    .stat {
      font-variant-numeric: tabular-nums;
      font-weight: 400;
      font-size: 0.9375rem;
      color: var(--text-black);
    }

    .stat--best {
      width: 100%;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-black-soft);
    }

    .stat span {
      font-weight: 600;
      color: var(--sb-green-accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 16px;
      min-height: 44px;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: var(--track);
      color: var(--text-white);
      background: var(--sb-green-accent);
      border: 1px solid var(--sb-green-accent);
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn:hover {
      background: var(--sb-green-accent-hover);
      border-color: var(--sb-green-accent-hover);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn:focus-visible {
      outline: 2px solid var(--sb-green-accent);
      outline-offset: 3px;
    }

    .board-wrap {
      width: min(96vw, 460px);
      padding: 1rem;
      background: var(--surface-white);
      border: 1px solid var(--canvas-ceramic);
      border-radius: var(--radius-card);
      box-shadow: var(--card-shadow);
    }

    #board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: clamp(0.35rem, 2vw, 0.6rem);
      aspect-ratio: 1;
    }

    .card {
      position: relative;
      aspect-ratio: 1;
      padding: 0;
      border: none;
      border-radius: var(--radius-card);
      cursor: pointer;
      font-size: clamp(1.5rem, 7.8vw, 2.3rem);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--card-shadow);
      transform-style: preserve-3d;
      perspective: 700px;
      transition:
        transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        opacity 0.25s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .card:active:not(:disabled) {
      transform: scale(0.95);
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-card);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-face--back {
      background: linear-gradient(165deg, #cfe6dc 0%, var(--sb-green-light) 100%);
      border: 1px solid rgba(255, 255, 255, 0.72);
      color: transparent;
    }

    .card-face--front {
      background: var(--surface-white);
      border: 1px solid var(--canvas-ceramic);
      transform: rotateY(180deg);
      user-select: none;
    }

    /* 뒷면: Green Light 계열 단색 + 미세 테두리 (문서의 색 블록 톤) */
    .card.is-back {
      transform: rotateY(0deg);
    }

    .card.is-front {
      transform: rotateY(180deg);
    }

    .card.is-matched {
      transform: rotateY(180deg);
      opacity: 0.45;
      cursor: default;
      pointer-events: none;
    }

    .card.is-match-hit {
      animation: matchPop 680ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
      z-index: 1;
    }

    .card.is-match-hit .card-face--front {
      animation: matchGlow 680ms ease-out;
    }

    #board.is-match-flash {
      animation: boardPulse 360ms ease-out;
    }

    @keyframes matchPop {
      0% {
        transform: rotateY(180deg) scale(1);
      }
      35% {
        transform: rotateY(180deg) scale(1.12);
      }
      70% {
        transform: rotateY(180deg) scale(0.96);
      }
      100% {
        transform: rotateY(180deg) scale(1);
      }
    }

    @keyframes matchGlow {
      0% {
        box-shadow: 0 0 0 rgba(0, 117, 74, 0);
      }
      45% {
        box-shadow:
          0 0 0 5px rgba(0, 117, 74, 0.32),
          0 14px 24px rgba(0, 117, 74, 0.22);
      }
      100% {
        box-shadow: 0 0 0 rgba(0, 117, 74, 0);
      }
    }

    @keyframes boardPulse {
      0% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.018);
      }
      100% {
        transform: scale(1);
      }
    }

    .card:focus-visible {
      outline: 2px solid var(--sb-green-accent);
      outline-offset: 2px;
    }

    .card:disabled {
      cursor: default;
    }

    #modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(30, 57, 50, 0.55);
      z-index: 10;
    }

    #modal[hidden] {
      display: none;
    }

    .modal-card {
      width: min(100%, 320px);
      padding: 1.75rem 1.5rem;
      background: var(--surface-white);
      border-radius: var(--radius-card);
      text-align: center;
      box-shadow: var(--card-shadow);
    }

    .modal-card h2 {
      margin: 0 0 0.75rem;
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: var(--track-tight);
      color: var(--sb-green);
    }

    .modal-card p {
      margin: 0.35rem 0;
      font-size: 0.9375rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-black-soft);
    }

    .modal-card .btn {
      margin-top: 1.25rem;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>이모지 메모리</h1>
  <div class="toolbar" role="group" aria-label="게임 정보">
    <div class="stat" id="timerLabel">시간 <span id="timer">00:00</span></div>
    <div class="stat">시도 <span id="moves">0</span>회</div>
    <div class="stat stat--best">최고 기록 <span id="bestRecord">-</span></div>
    <button type="button" class="btn" id="restartBtn">다시 시작</button>
  </div>
  <main class="board-wrap">
    <div id="board" role="grid" aria-label="카드 보드"></div>
  </main>

  <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h2 id="modalTitle">완료!</h2>
      <p id="modalTime"></p>
      <p id="modalMoves"></p>
      <button type="button" class="btn" id="playAgainBtn">다시 하기</button>
    </div>
  </div>

  <script>
    (function () {
      const EMOJIS = ["🐶", "🐱", "🦊", "🐻", "🐼", "🐵", "🐯", "🦁"];
      const FLIP_BACK_MS = 700;

      const boardEl = document.getElementById("board");
      const timerEl = document.getElementById("timer");
      const movesEl = document.getElementById("moves");
      const bestRecordEl = document.getElementById("bestRecord");
      const restartBtn = document.getElementById("restartBtn");
      const modalEl = document.getElementById("modal");
      const modalTimeEl = document.getElementById("modalTime");
      const modalMovesEl = document.getElementById("modalMoves");
      const playAgainBtn = document.getElementById("playAgainBtn");
      const BEST_KEY = "lumo-memory-best";

      let deck = [];
      /** @type {('hidden'|'flipped'|'matched')[]} */
      let states = [];
      let firstIndex = null;
      let boardLocked = false;
      let moves = 0;
      let timerId = null;
      let gameStarted = false;
      let startTime = 0;
      let bestRecord = loadBestRecord();

      function shuffle(array) {
        const a = array.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function formatMmSs(ms) {
        const totalSec = Math.floor(ms / 1000);
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      function stopTimer() {
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function loadBestRecord() {
        try {
          const raw = localStorage.getItem(BEST_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (
            !parsed ||
            typeof parsed.timeMs !== "number" ||
            !Number.isFinite(parsed.timeMs) ||
            typeof parsed.moves !== "number" ||
            !Number.isFinite(parsed.moves)
          ) {
            return null;
          }
          return { timeMs: parsed.timeMs, moves: parsed.moves };
        } catch (_) {
          return null;
        }
      }

      function saveBestRecord(record) {
        try {
          localStorage.setItem(BEST_KEY, JSON.stringify(record));
        } catch (_) {
          // ignore storage failures
        }
      }

      function isBetterRecord(next, current) {
        if (!current) return true;
        if (next.timeMs < current.timeMs) return true;
        if (next.timeMs === current.timeMs && next.moves < current.moves) return true;
        return false;
      }

      function updateBestRecordDisplay() {
        if (!bestRecord) {
          bestRecordEl.textContent = "-";
          return;
        }
        bestRecordEl.textContent = formatMmSs(bestRecord.timeMs) + " · " + bestRecord.moves + "회";
      }

      function updateTimerDisplay() {
        if (!gameStarted) {
          timerEl.textContent = "00:00";
          return;
        }
        timerEl.textContent = formatMmSs(Date.now() - startTime);
      }

      function ensureTimerRunning() {
        if (gameStarted) return;
        gameStarted = true;
        startTime = Date.now();
        stopTimer();
        timerId = setInterval(updateTimerDisplay, 250);
        updateTimerDisplay();
      }

      function cardClass(i) {
        if (states[i] === "matched") return "card is-matched";
        if (states[i] === "flipped") return "card is-front";
        return "card is-back";
      }

      function syncCardButton(btn, i) {
        btn.className = cardClass(i);
        const frontEl = btn.querySelector(".card-face--front");
        if (frontEl) frontEl.textContent = deck[i];
        btn.disabled = states[i] === "matched";
        btn.setAttribute(
          "aria-label",
          states[i] === "matched" ? "맞춘 카드" : states[i] === "flipped" ? "앞면 " + deck[i] : "뒷면 카드"
        );
      }

      function renderAll() {
        const buttons = boardEl.querySelectorAll(".card");
        buttons.forEach(function (btn, i) {
          syncCardButton(btn, i);
        });
        movesEl.textContent = String(moves);
        updateTimerDisplay();
      }

      function buildBoard() {
        boardEl.innerHTML = "";
        for (let i = 0; i < 16; i++) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "card is-back";
          btn.dataset.index = String(i);
          btn.innerHTML =
            '<span class="card-face card-face--back" aria-hidden="true"></span><span class="card-face card-face--front" aria-hidden="true"></span>';
          btn.addEventListener("click", function () {
            onCardClick(i);
          });
          boardEl.appendChild(btn);
        }
      }

      function allMatched() {
        return states.every(function (s) {
          return s === "matched";
        });
      }

      function openWinModal() {
        stopTimer();
        const elapsed = gameStarted ? Date.now() - startTime : 0;
        const currentRecord = { timeMs: elapsed, moves: moves };
        if (isBetterRecord(currentRecord, bestRecord)) {
          bestRecord = currentRecord;
          saveBestRecord(bestRecord);
          updateBestRecordDisplay();
        }
        modalTimeEl.textContent = "최종 시간 " + formatMmSs(elapsed);
        modalMovesEl.textContent = "시도 " + moves + "회";
        modalEl.hidden = false;
      }

      function closeModal() {
        modalEl.hidden = true;
      }

      function newGame() {
        stopTimer();
        closeModal();
        deck = shuffle(EMOJIS.concat(EMOJIS));
        states = new Array(16).fill("hidden");
        firstIndex = null;
        boardLocked = false;
        moves = 0;
        gameStarted = false;
        startTime = 0;
        timerEl.textContent = "00:00";
        if (!boardEl.querySelector(".card")) buildBoard();
        updateBestRecordDisplay();
        renderAll();
      }

      function onCardClick(i) {
        if (boardLocked) return;
        if (states[i] === "matched" || states[i] === "flipped") return;

        ensureTimerRunning();
        states[i] = "flipped";
        const btn = boardEl.querySelector('.card[data-index="' + i + '"]');
        if (btn) syncCardButton(btn, i);

        if (firstIndex === null) {
          firstIndex = i;
          return;
        }

        if (firstIndex === i) return;

        moves += 1;
        movesEl.textContent = String(moves);

        const a = firstIndex;
        const b = i;
        firstIndex = null;

        if (deck[a] === deck[b]) {
          states[a] = "matched";
          states[b] = "matched";
          renderAll();
          triggerMatchEffect(a, b);
          if (allMatched()) openWinModal();
        } else {
          boardLocked = true;
          setTimeout(function () {
            states[a] = "hidden";
            states[b] = "hidden";
            boardLocked = false;
            renderAll();
          }, FLIP_BACK_MS);
        }
      }

      restartBtn.addEventListener("click", newGame);
      playAgainBtn.addEventListener("click", newGame);

      function triggerMatchEffect(a, b) {
        boardEl.classList.remove("is-match-flash");
        void boardEl.offsetWidth;
        boardEl.classList.add("is-match-flash");
        setTimeout(function () {
          boardEl.classList.remove("is-match-flash");
        }, 380);

        [a, b].forEach(function (idx) {
          const btn = boardEl.querySelector('.card[data-index="' + idx + '"]');
          if (!btn) return;
          btn.classList.remove("is-match-hit");
          void btn.offsetWidth;
          btn.classList.add("is-match-hit");
          setTimeout(function () {
            btn.classList.remove("is-match-hit");
          }, 720);
        });
      }

      buildBoard();
      newGame();
    })();
  </script>
</body>
</html>
